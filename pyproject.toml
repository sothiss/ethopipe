[project]
name = "ethopipe"
version = "0.1.0"
description = "Open-science ethological data ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Alice Severi Gonçalves" }
]
license = { text = "MIT" }
# license-files = ["LICENSE"]


dependencies = [
  "fastapi==0.138.1",
  "pydantic==2.13.4",
  "pandas==3.0.3",
  "uvicorn==0.49.0",
  "pytest==9.0.3",
  "supabase>=2.31.0",
  "ddtrace>=4.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.isort]
known-first-party = ["src"]

[dependency-groups]
dev = [
    "ruff==0.11.0",
    "black==26.3.1",
    "pre-commit>=4.6.0",
    "hypothesis>=6.112.0",
]

[tool.datadog]
generate-config = true

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"



