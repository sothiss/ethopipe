[project]
name = "ethopipe"
version = "0.1.0"
description = "Open-science ethological data ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Alice Severi Gonçalves" }
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
  "fastapi==0.138.1",
  "pydantic==2.13.4",
  "pandas==3.0.3",
  "uvicorn==0.49.0",
  "pytest==9.1.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88