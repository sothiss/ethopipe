[project]
name = "ethopipe"
version = "0.2.0"
description = "Open-science ethological data ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Alice Severi Gonçalves" }
]
license = { text = "MIT" }
# license-files = ["LICENSE"]


dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "pandas==3.1.0",
  "uvicorn==0.54.0",
  "pytest==9.2.0",
  "supabase>=2.33.0",
  "ddtrace>=4.16.1",
  "sentry-sdk>=2.73.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pre-commit>=4.7.0",
    "hypothesis>=6.170.14",
    "pytest-cov>=7.1.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
]

[tool.datadog]
generate-config = true

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
plugins = [
    "pydantic.mypy"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
omit = [
    "src/utils/*",
]
