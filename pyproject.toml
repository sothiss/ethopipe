[project]
name = "ethopipe"
version = "0.2.0a0"
description = "Open-science ethological data ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Alice Severi Gonçalves" }
]
license = { text = "MIT" }
# license-files = ["LICENSE"]


dependencies = [
  "fastapi==0.138.1",
  "pydantic==2.13.4",
  "pandas==3.0.3",
  "uvicorn==0.52.4",
  "pytest==9.0.3",
  "supabase>=2.31.0",
  "ddtrace>=4.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[dependency-groups]
dev = [
    "ruff==0.16.6",
    "pre-commit>=4.6.0",
    "hypothesis>=6.112.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.1",
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
]

[tool.datadog]
generate-config = true

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
plugins = [
    "pydantic.mypy"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
omit = [
    "src/utils/*",
]
