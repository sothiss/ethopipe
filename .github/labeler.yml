# Configuration for actions/labeler v5

core:
  - changed-files:
      - any-glob-to-any-file: 'src/**/*'

tests:
  - changed-files:
      - any-glob-to-any-file: 'tests/**/*'

ci-cd:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**/*'

manuscript:
  - changed-files:
      - any-glob-to-any-file:
          - 'paper.md'
          - 'paper.bib'
          - 'paper.pdf'
          - 'CITATION.cff'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - 'poetry.lock'
