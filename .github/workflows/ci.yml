name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "JOURNEY.md"
      - "CHANGELOG.md"
      - "DESIGN.md"
      - "project-timeline.md"
      - "gemini-code-*.md"
      - "SUMMARY.md"
      - "gitbook-docs.yaml"
      - "docs/states/**"
      - "docs/walkthroughs/**"
      - "docs/handoffs/**"
      - "docs/audits/**"
      - "docs/ideas/**"
      - "docs/releases/**"
      - "docs/IDEAS_BOARD.md"
      - "docs/PROJECT_STATE.md"
      - "docs/AGENT_HANDOFF*.md"
      - "docs/CODE_COMPANION_WORKFLOW.md"
      - "docs/COMPANION_TASK.md"
      - "docs/LLM_SNAPSHOT.md"
      - "docs/OPEN_SOURCE_*.md"
      - "docs/SOLO_MAINTAINER_AUDIT.md"
      - "docs/README.md"
      - "index.html"
      - "CNAME"
      - "logo*.svg"
      - "assets/**"
      - "the-project/**"
      - "ethopipe/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "JOURNEY.md"
      - "CHANGELOG.md"
      - "DESIGN.md"
      - "project-timeline.md"
      - "gemini-code-*.md"
      - "SUMMARY.md"
      - "gitbook-docs.yaml"
      - "docs/states/**"
      - "docs/walkthroughs/**"
      - "docs/handoffs/**"
      - "docs/audits/**"
      - "docs/ideas/**"
      - "docs/releases/**"
      - "docs/IDEAS_BOARD.md"
      - "docs/PROJECT_STATE.md"
      - "docs/AGENT_HANDOFF*.md"
      - "docs/CODE_COMPANION_WORKFLOW.md"
      - "docs/COMPANION_TASK.md"
      - "docs/LLM_SNAPSHOT.md"
      - "docs/OPEN_SOURCE_*.md"
      - "docs/SOLO_MAINTAINER_AUDIT.md"
      - "docs/README.md"
      - "index.html"
      - "CNAME"
      - "logo*.svg"
      - "assets/**"
      - "the-project/**"
      - "ethopipe/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-guardrails:
    name: Quality, Tests & Guardrails (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify Solo Maintainer Guardrails
        run: uv run python scripts/audit_maintainer_guardrails.py --strict

      - name: Verify Code Quality, Coverage & Open Science Standards
        run: uv run python scripts/verify_open_source_standards.py

  compat-py311:
    name: Compatibility Suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Test Suite on Python 3.11
        run: uv run pytest tests/ -q
