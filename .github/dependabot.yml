version: 2
updates:
  # Python Dependencies (pyproject.toml / uv) — grouped monthly for solo maintainer
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "auto"
    groups:
      dev-dependencies:
        patterns:
          - "ruff*"
          - "pytest*"
          - "mypy*"
          - "pre-commit*"
          - "hypothesis*"
          - "httpx*"
          - "pandas-stubs*"
      core-dependencies:
        patterns:
          - "*"

  # GitHub Actions Workflows — grouped monthly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    rebase-strategy: "auto"
    groups:
      actions:
        patterns:
          - "*"
