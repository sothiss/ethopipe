version: 2
updates:
  # Python Dependencies (pyproject.toml / uv)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "track:maintainer"
    rebase-strategy: "auto"
    groups:
      dev-dependencies:
        patterns:
          - "ruff*"
          - "pytest*"
          - "mypy*"
          - "pre-commit*"
          - "hypothesis*"
          - "httpx*"
          - "pandas-stubs*"
      core-dependencies:
        patterns:
          - "*"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "track:maintainer"
    rebase-strategy: "auto"
    groups:
      actions:
        patterns:
          - "*"
