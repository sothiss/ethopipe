specVersion: "v1"
serviceId: "ethopipe"
location: "us-east4"
schemas:
  - source: "./schema"
    datasource:
      postgresql:
        database: "fdcdb"
        cloudSql:
          instanceId: "ethopipe-fdc"
          schemaValidation: "COMPATIBLE" # COMPATIBLE mode makes Postgres schema compatible with Data Connect.
connectorDirs: ["./example"]
