# EthoPipe Data Connect Mutations

mutation UpsertSubject($id: String!, $species: String!, $dogSizeCategory: String) @auth(level: PUBLIC, insecureReason: "Public upsert allowed for testing.") {
  subject_upsert(data: {
    id: $id
    species: $species
    dogSizeCategory: $dogSizeCategory
  })
}

mutation CreateObservation(
  $id: String!
  $subjectId: String!
  $timestamp: Timestamp!
  $location: String!
  $latitude: Float
  $longitude: Float
  $behaviorType: String!
  $behaviorValue: String!
  $severityScore: Int
  $behaviorTypeId: String
  $heartRate: Int
  $heartRateUnit: String!
  $bodyTemp: Float
  $tempUnit: String!
  $respiratoryRate: Int
  $respiratoryRateUnit: String!
  $cortisolLevel: Float
  $cortisolUnit: String!
  $cortisolMatrix: String
  $observationMethod: String!
  $narrative: String!
) @auth(level: PUBLIC, insecureReason: "Public insert allowed for testing.") {
  observation_insert(data: {
    id: $id
    subjectId: $subjectId
    timestamp: $timestamp
    location: $location
    latitude: $latitude
    longitude: $longitude
    behaviorType: $behaviorType
    behaviorValue: $behaviorValue
    severityScore: $severityScore
    behaviorTypeId: $behaviorTypeId
    heartRate: $heartRate
    heartRateUnit: $heartRateUnit
    bodyTemp: $bodyTemp
    tempUnit: $tempUnit
    respiratoryRate: $respiratoryRate
    respiratoryRateUnit: $respiratoryRateUnit
    cortisolLevel: $cortisolLevel
    cortisolUnit: $cortisolUnit
    cortisolMatrix: $cortisolMatrix
    observationMethod: $observationMethod
    narrative: $narrative
  })
}

mutation CreateQuarantineRecord(
  $id: String!
  $rawPayload: String!
  $errors: String!
  $ingestedAt: Timestamp!
  $originalIndex: Int
) @auth(level: PUBLIC, insecureReason: "Public insert allowed for testing.") {
  quarantineRecord_insert(data: {
    id: $id
    rawPayload: $rawPayload
    errors: $errors
    ingestedAt: $ingestedAt
    originalIndex: $originalIndex
  })
}
