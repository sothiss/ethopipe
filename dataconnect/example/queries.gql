# EthoPipe Data Connect Queries

query ListObservations @auth(level: PUBLIC, insecureReason: "Anyone can list all observations.") {
  observations {
    id
    timestamp
    location
    latitude
    longitude
    behaviorType
    behaviorValue
    severityScore
    behaviorTypeId
    heartRate
    heartRateUnit
    bodyTemp
    tempUnit
    respiratoryRate
    respiratoryRateUnit
    cortisolLevel
    cortisolUnit
    cortisolMatrix
    observationMethod
    narrative
    subject {
      id
      species
      dogSizeCategory
    }
  }
}

query GetSubjectObservations($subjectId: String!) @auth(level: PUBLIC, insecureReason: "Anyone can get subject observations.") {
  observations(where: { subjectId: { eq: $subjectId } }) {
    id
    timestamp
    location
    latitude
    longitude
    behaviorType
    behaviorValue
    severityScore
    behaviorTypeId
    heartRate
    heartRateUnit
    bodyTemp
    tempUnit
    respiratoryRate
    respiratoryRateUnit
    cortisolLevel
    cortisolUnit
    cortisolMatrix
    observationMethod
    narrative
  }
}

query ListSubjects @auth(level: PUBLIC, insecureReason: "Anyone can list all subjects.") {
  subjects {
    id
    species
    dogSizeCategory
  }
}

query ListQuarantineRecords @auth(level: PUBLIC, insecureReason: "Anyone can list all quarantine records.") {
  quarantineRecords {
    id
    rawPayload
    errors
    ingestedAt
    originalIndex
  }
}
