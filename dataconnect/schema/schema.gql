# EthoPipe Data Connect Schema for Applied Canine Ethology

# Subject represents the canine subject.
type Subject @table {
  id: String!
  species: String! @col(dataType: "varchar(100)")
  dogSizeCategory: String @col(dataType: "varchar(20)")
}

# Observation represents a validated behavioral and physiological ethological observation.
type Observation @table {
  id: String!
  subject: Subject!
  timestamp: Timestamp!
  location: String! @col(dataType: "text")
  latitude: Float
  longitude: Float
  behaviorType: String! @col(dataType: "varchar(100)")
  behaviorValue: String! @col(dataType: "varchar(255)")
  severityScore: Int
  behaviorTypeId: String @col(dataType: "text")
  heartRate: Int
  heartRateUnit: String! @col(dataType: "varchar(20)")
  bodyTemp: Float
  tempUnit: String! @col(dataType: "varchar(20)")
  respiratoryRate: Int
  respiratoryRateUnit: String! @col(dataType: "varchar(255)")
  cortisolLevel: Float
  cortisolUnit: String! @col(dataType: "varchar(20)")
  cortisolMatrix: String @col(dataType: "varchar(50)")
  observationMethod: String! @col(dataType: "varchar(50)")
  narrative: String! @col(dataType: "text")
}

# QuarantineRecord represents raw records that failed Pydantic operational boundary validation.
type QuarantineRecord @table {
  id: String!
  rawPayload: String! @col(dataType: "text")
  errors: String! @col(dataType: "text")
  ingestedAt: Timestamp!
  originalIndex: Int
}
